[aliases]
# Define setup.py command aliases here
test = pytest

; flake8 and pycodestyle do not read pyproject.toml, so the lint settings
; live here.
[flake8]
exclude = docs
extend-ignore = E501,F401,E128,E231,E124,W293,W291,E251,E265,E303,E302,E306
max-line-length = 160
style = numpy
check-return-types = false

[pycodestyle]
count = false
ignore = W191,W291,W293,E231,E225,E251,E265,E303,E302,E306,E128,E226
max-line-length = 160
statistics = false
