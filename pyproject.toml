[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autoemcee"
version = "0.4.2"
description = "Run affine-invariant sampler in automated fashion until convergence."
readme = {file = "README.rst", content-type = "text/x-rst"}
license = {text = "GNU General Public License v3"}
authors = [
    {name = "Johannes Buchner", email = "johannes.buchner.acad@gmx.com"}
]
requires-python = ">=2.7, !=3.0.*, !=3.1.*, !=3.2.*, !=3.3.*, !=3.4.*"
dependencies = ["numpy", "emcee", "arviz"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Programming Language :: Python :: 2",
    "Programming Language :: Python :: 2.7",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.5",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
]

[project.optional-dependencies]
test = ["pytest>=3"]

[project.urls]
Homepage = "https://github.com/JohannesBuchner/autoemcee"
Source = "https://github.com/JohannesBuchner/autoemcee"
Documentation = "https://johannesbuchner.github.io/autoemcee/"

[tool.bumpversion]
current_version = "0.4.2"
commit = true
tag = true

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = "version = \"{current_version}\""
replace = "version = \"{new_version}\""

[[tool.bumpversion.files]]
filename = "autoemcee.py"
search = "__version__ = '{current_version}'"
replace = "__version__ = '{new_version}'"

[tool.setuptools]
py-modules = ["autoemcee"]

[flake8]
exclude = "docs"
ignore = "E501,F401,E128,E231,E124"
style = "numpy"
check-return-types = false

[tool.pycodestyle]
count = false
ignore = "W191,W291,W293,E231,E225"
max-line-length = 160
statistics = false

[tool.pydocstyle]
add-ignore = "D107"
